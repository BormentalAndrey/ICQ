name: Android Debug CI

on:
  push:
    branches: [ main, develop, debug, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        target: default
        arch: x86_64
        force: true
    
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Clean build
      run: ./gradlew clean
    
    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --stacktrace
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: nexus-player-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        compression-level: 0
        overwrite: true
        retention-days: 7
    
    - name: Show APK info
      run: |
        echo "=== APK File Info ==="
        ls -lh app/build/outputs/apk/debug/app-debug.apk
        echo ""
        echo "=== Build Outputs ==="
        ls -la app/build/outputs/apk/debug/
